[package]
name = "round-robin-quorum"
version = "0.1.0"
edition = "2024"
description = "Учебно-исследовательский однопроцессный прототип консорциумного блокчейна"
license = "MIT"

[lib]
name = "round_robin_quorum"
path = "src/lib.rs"

[[bin]]
name = "round-robin-quorum-server"
path = "src/main.rs"

[[bin]]
name = "experiment"
path = "src/bin/experiment.rs"

[dependencies]
axum = "0.8"
ed25519-dalek = "2.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

